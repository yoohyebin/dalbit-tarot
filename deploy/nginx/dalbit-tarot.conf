# Nginx 리버스 프록시. certbot 이 443 블록을 추가한다.

upstream dalbit_app {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # certbot 갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://dalbit_app;

        # $host 는 포트를 떼고 넘긴다. 80 이 아닌 포트로 들어오면(SSH 터널 localhost:9000 등)
        # 앱이 만드는 절대 주소·리다이렉트에서 포트가 빠져 엉뚱한 곳으로 간다.
        # $http_host 는 브라우저가 보낸 Host 를 포트까지 그대로 넘긴다
        proxy_set_header Host              $http_host;
        # $proxy_add_x_forwarded_for 는 클라이언트가 보낸 값 뒤에 이어 붙인다.
        # 맨 앞 값을 위조할 수 있어 요청 제한을 우회당한다. 반드시 덮어쓴다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;

        # LLM 해석은 20초 안팎 걸린다. 기본 60초로 충분하지만 명시해 둔다
        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
        proxy_send_timeout    30s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 카드 이미지·CSS·JS. 파일명이 바뀌지 않으므로 길게 잡는다
    location ~* ^/(images|css|js)/ {
        proxy_pass http://dalbit_app;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    # text/html 은 Nginx 가 원래 압축한다. 목록에 넣으면 중복 경고가 난다
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    client_max_body_size 1m;
}

