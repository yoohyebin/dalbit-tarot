services:
  mysql:
    image: mysql:8.0
    container_name: dalbit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dalbit_tarot
      MYSQL_USER: dalbit
      MYSQL_PASSWORD: dalbit
      TZ: Asia/Seoul
    ports:
      - "3307:3306"   # 호스트 3306은 Homebrew MySQL이 사용 중
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dalbit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dalbit-mysql-data:
