name: Deploy

# develop 에 쌓인 변경을 main 에 머지하면 배포된다.
# 수동 실행도 열어 둔다(롤백·재배포용).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dalbit_tarot
          MYSQL_USER: dalbit
          MYSQL_PASSWORD: dalbit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드 및 테스트
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/dalbit_tarot?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: dalbit
          DB_PASSWORD: dalbit
        run: ./gradlew clean build --no-daemon

      # 이미지 작업이 이 jar 을 그대로 쓴다. 컨테이너 안에서 다시 빌드하지 않는다
      - name: jar 전달
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 테스트한 jar 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - id: meta
        name: 이미지 태그 결정
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 커밋 해시 태그를 같이 남긴다. 롤백할 때 이 태그로 되돌린다
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # 서버가 GITHUB_TOKEN 으로 GHCR 에서 이미지를 받는다.
    # 저장소 기본 권한 설정에 기대지 않고 명시한다
    permissions:
      packages: read
    steps:
      - name: EC2 에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/dalbit-tarot

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # .env 의 APP_IMAGE 를 이번 태그로 바꾼다
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ env.IMAGE_NAME }}:${{ needs.image.outputs.tag }}|" .env

            docker compose -f compose.prod.yaml pull app
            docker compose -f compose.prod.yaml up -d

            # 헬스체크. 실패하면 배포를 실패로 표시한다
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
                echo "헬스체크 통과 (${i}회 시도)"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "헬스체크 실패. 최근 로그:"
            docker compose -f compose.prod.yaml logs --tail 50 app
            exit 1
