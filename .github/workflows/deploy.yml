name: Deploy

# develop 에 쌓인 변경을 main 에 머지하면 배포된다.
# 수동 실행도 열어 둔다(롤백·재배포용).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 배포가 겹치면 보안그룹 임시 규칙과 서버의 .env 수정이 서로 엉킨다. 한 번에 하나씩 돌린다
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dalbit_tarot
          MYSQL_USER: dalbit
          MYSQL_PASSWORD: dalbit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드 및 테스트
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/dalbit_tarot?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: dalbit
          DB_PASSWORD: dalbit
        run: ./gradlew clean build --no-daemon

      # 이미지 작업이 이 jar 을 그대로 쓴다. 컨테이너 안에서 다시 빌드하지 않는다
      - name: jar 전달
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 테스트한 jar 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - id: meta
        name: 이미지 태그 결정
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 커밋 해시 태그를 같이 남긴다. 롤백할 때 이 태그로 되돌린다
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      # 서버가 GITHUB_TOKEN 으로 GHCR 에서 이미지를 받는다.
      # 저장소 기본 권한 설정에 기대지 않고 명시한다
      packages: read
      # AWS 역할을 OIDC 로 받는다. 액세스 키를 Secrets 에 두지 않기 위해서다
      id-token: write
    steps:
      # 보안그룹의 22번은 평소 관리자 IP 만 열려 있다. GitHub 러너 IP 는 매번 바뀌고
      # 대역이 너무 넓어 미리 등록할 수 없으므로, 배포하는 동안만 이번 러너 IP 하나를 연다
      - name: AWS 자격 증명
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 러너 IP 확인
        id: runner
        run: echo "ip=$(curl -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: 보안그룹에 러너 IP 임시 허용
        id: allow
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.runner.outputs.ip }}/32,Description=github-actions-deploy}]"

      # compose·Nginx 설정은 저장소가 기준이다. 전에는 바뀔 때마다 사람이 직접 scp 했는데,
      # 빠뜨리면 새 이미지가 옛 설정으로 뜬다(카카오 키가 앱에 안 넘어가는 식으로).
      # .env 는 비밀값이 있어 서버에만 두고 옮기지 않는다
      - name: 설정 파일 받기
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: 서버에 설정 파일 올리기
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          # 바로 덮어쓰지 않고 .new 로 올린다. 배포 단계에서 검사한 뒤 바꿔 넣는다
          scp "${opts[@]}" deploy/compose.prod.yaml "$TARGET:dalbit-tarot/compose.prod.yaml.new"
          scp "${opts[@]}" deploy/nginx/dalbit-tarot.conf "$TARGET:dalbit-tarot/nginx/dalbit-tarot.conf.new"
          rm -f "$key"

      - name: EC2 에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/dalbit-tarot

            # 올려 둔 설정 파일로 바꿔 넣는다. compose 는 먼저 검사해서 깨진 파일로 서비스를 내리지 않는다
            docker compose -f compose.prod.yaml.new config -q
            mv compose.prod.yaml.new compose.prod.yaml
            cp nginx/dalbit-tarot.conf nginx/dalbit-tarot.conf.bak
            mv nginx/dalbit-tarot.conf.new nginx/dalbit-tarot.conf

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # .env 의 APP_IMAGE 를 이번 태그로 바꾼다
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ env.IMAGE_NAME }}:${{ needs.image.outputs.tag }}|" .env

            docker compose -f compose.prod.yaml pull app
            docker compose -f compose.prod.yaml up -d

            # Nginx 는 이미지가 그대로면 다시 뜨지 않아서 바뀐 설정을 직접 다시 읽힌다.
            # 설정이 틀리면 이전 설정으로 되돌리고 배포를 실패로 둔다. 실행 중인 Nginx 는 옛 설정 그대로 돈다
            if ! docker compose -f compose.prod.yaml exec -T nginx nginx -t; then
              mv nginx/dalbit-tarot.conf.bak nginx/dalbit-tarot.conf
              echo "Nginx 설정 오류. 이전 설정으로 되돌렸다"
              exit 1
            fi
            docker compose -f compose.prod.yaml exec -T nginx nginx -s reload

            # 헬스체크. 실패하면 배포를 실패로 표시한다
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
                echo "헬스체크 통과 (${i}회 시도)"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "헬스체크 실패. 최근 로그:"
            docker compose -f compose.prod.yaml logs --tail 50 app
            exit 1

      # 배포가 실패하거나 취소돼도 반드시 닫는다. 허용 단계가 성공했을 때만 돈다
      - name: 보안그룹 임시 규칙 삭제
        if: always() && steps.allow.outcome == 'success'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.runner.outputs.ip }}/32"
