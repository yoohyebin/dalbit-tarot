name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트가 실제 MySQL 에 붙으므로 서비스 컨테이너를 띄운다.
    # 로컬은 3307(호스트에 다른 MySQL 이 있어서), CI 는 3306 을 쓰고 DB_URL 로 덮는다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dalbit_tarot
          MYSQL_USER: dalbit
          MYSQL_PASSWORD: dalbit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/dalbit_tarot?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: dalbit
          DB_PASSWORD: dalbit
        run: ./gradlew clean build --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          retention-days: 7
