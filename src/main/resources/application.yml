spring:
  application:
    name: dalbit-tarot

  datasource:
    url: jdbc:mysql://localhost:3307/dalbit_tarot?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: dalbit
    password: dalbit

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    kr.dalbittarot: DEBUG

dalbit:
  llm:
    # 키가 비어 있으면 StubLlmClient 로 뜬다. 실제 해석을 보려면 GEMINI_API_KEY 를 넣는다
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash-lite   # 저비용 모델. 구현 시점 가격 재확인 필요
    base-url: https://generativelanguage.googleapis.com/v1beta
    max-output-tokens: 700         # 비용이 출력 토큰에 붙으므로 상한을 둔다
    temperature: 0.9               # 같은 카드라도 문장이 조금씩 달라지게
    timeout: 20s
    max-retries: 1

  rate-limit:
    enabled: true
    capacity: 10
    window: 1m

  retention:
    period: 365d   # 개인정보처리방침의 '1년 후 자동 삭제' 와 맞춰야 한다
    cron: "0 30 4 * * *"

  privacy:
    # 개인정보처리방침 페이지에 그대로 노출되는 값이다. 법적으로 연락이 닿아야 하는 정보라 숨기지 않는다
    owner-name: 유혜빈
    contact-email: hyebin218@naver.com

  admin:
    # 관리자 화면(/admin) 로그인. 소스에 기본값을 두지 않는다.
    # 비워 두면 기동할 때마다 무작위 비밀번호를 만들어 로그에 찍는다.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
