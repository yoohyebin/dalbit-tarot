<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('의견 보내기')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="wrap">
    <section class="fade-in">
        <h1>의견을 들려주세요</h1>
        <p>쓰면서 불편했던 점, 있었으면 하는 기능 무엇이든 좋습니다.</p>
    </section>

    <form id="feedback-form" autocomplete="off">
        <div class="field">
            <label for="nickname">닉네임<span class="optional">선택</span></label>
            <input type="text" id="nickname" maxlength="20" placeholder="비우면 익명으로 남습니다">
        </div>

        <div class="field">
            <label for="content">내용</label>
            <textarea id="content" rows="7" maxlength="1000" required
                      placeholder="자유롭게 적어 주세요."></textarea>
            <p class="hint"><span id="counter">0</span> / 1000</p>
        </div>

        <p class="deck-status" id="status"></p>

        <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="submit">보내기</button>
        </div>
    </form>

    <section id="done" hidden class="fade-in">
        <div class="notice">보내주셔서 고맙습니다. 잘 읽겠습니다.</div>
        <div class="btn-row">
            <a class="btn btn-ghost" th:href="@{/}">처음으로</a>
        </div>
    </section>

    <div class="notice">
        로그인이 없어 작성자를 확인할 수 없습니다. 연락처나 개인정보는 적지 말아 주세요.
    </div>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
<script th:src="@{/js/feedback.js}"></script>
</body>
</html>
