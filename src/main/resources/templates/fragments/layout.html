<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="카드를 뽑으면 관심 분야에 맞춰 해석을 보여주는 무료 타로 서비스입니다.">
    <!-- 결과 화면에서만 채운다. 카카오톡·메신저에 링크를 붙였을 때 미리보기로 쓰인다 -->
    <th:block th:if="${share != null}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="달빛타로">
        <meta property="og:title" th:content="${share.title}">
        <meta property="og:description" th:content="${share.description}">
        <meta property="og:url" th:content="${share.url}">
        <meta property="og:image" th:content="${share.imageUrl}">
        <meta property="og:image:width" th:content="${share.imageWidth}">
        <meta property="og:image:height" th:content="${share.imageHeight}">
    </th:block>
    <title th:text="${pageTitle} != null ? ${pageTitle} + ' · 달빛타로' : '달빛타로'">달빛타로</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
<header th:fragment="siteHeader" class="site-header">
    <a class="logo" th:href="@{/}">☾ 달빛타로</a>
</header>

<footer th:fragment="siteFooter" class="site-footer">
    <p>해석 결과는 참고용 콘텐츠입니다. 의료·법률·투자 등의 판단 근거로 삼지 마세요.</p>
    <p><a th:href="@{/feedback}">의견 보내기</a> · <a th:href="@{/privacy}">개인정보처리방침</a></p>
</footer>
</body>
</html>
