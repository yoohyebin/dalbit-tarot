<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('정보 입력')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="wrap">
    <section class="fade-in">
        <h1 th:text="${category.label}">애정운</h1>
        <p class="hint" th:text="${category.description}">설명</p>
    </section>

    <form id="input-form" autocomplete="off">
        <input type="hidden" id="category-code" th:value="${category.code}">

        <div class="field">
            <label>몇 장을 뽑을까요?</label>
            <div class="choice-group">
                <label class="choice" th:each="spread, iter : ${spreadTypes}">
                    <input type="radio" name="spreadType" th:value="${spread.name()}"
                           th:attr="data-card-count=${spread.cardCount}" th:checked="${iter.first}">
                    <span th:text="${spread.label} + ' (' + ${spread.cardCount} + '장)'">원카드 (1장)</span>
                </label>
            </div>
        </div>

        <div class="field">
            <label for="birth-date">생년월일<span class="optional">선택</span></label>
            <!-- 달력 대신 숫자로 적게 한다. 달력은 연·월을 고르면 닫혀서 일을 고르려고 다시 열어야 했다 -->
            <input type="text" id="birth-date" name="birthDate" class="birth-input"
                   inputmode="numeric" placeholder="예) 1998.03.15"
                   aria-describedby="birth-date-error">
            <p class="field-error" id="birth-date-error" role="alert" hidden></p>
            <p class="hint">숫자 8자리만 입력하면 됩니다. 해석 문장을 만들 때 참고만 하고, 사주 계산은 하지 않습니다.</p>
        </div>

        <div class="field">
            <label for="gender">성별<span class="optional">선택</span></label>
            <select id="gender" name="gender">
                <option value="NONE">선택하지 않음</option>
                <option value="FEMALE">여성</option>
                <option value="MALE">남성</option>
            </select>
        </div>

        <p class="hint">생년월일과 성별은 비워 두셔도 됩니다.</p>

        <div class="btn-row">
            <button type="submit" class="btn btn-primary">카드 뽑으러 가기</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
<script th:src="@{/js/input.js}"></script>
</body>
</html>
